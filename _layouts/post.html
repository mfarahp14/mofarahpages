<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ page.title }} — Mohammed Farah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/style.css" />
  <script src="/script.js" defer></script>

  <style>
    .post-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }

    .post-back {
      display: inline-block;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-sub);
      text-decoration: none;
      margin-bottom: 2rem;
    }

    .post-back:hover { color: var(--accent); }

    .post-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      letter-spacing: 0.04em;
      margin: 0 0 0.4rem;
      color: var(--text-main);
    }

    .post-date {
      display: block;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-sub);
      margin-bottom: 2.5rem;
    }

    .post-divider {
      border: none;
      border-top: 1px solid rgba(200, 170, 140, 0.3);
      margin-bottom: 2.5rem;
    }

    .post-content {
      font-size: 0.97rem;
      color: var(--text-sub);
      line-height: 1.85;
    }

    .post-content h2 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      color: var(--text-main);
      margin: 2.5rem 0 0.7rem;
    }

    .post-content h3 {
      font-family: var(--font-display);
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      color: var(--text-main);
      margin: 2rem 0 0.5rem;
    }

    .post-content p { margin: 0 0 1.1rem; }

    .post-content a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .post-content a:hover { color: var(--text-main); }

    .post-content ul,
    .post-content ol {
      padding-left: 1.3rem;
      margin: 0 0 1.1rem;
    }

    .post-content li { margin-bottom: 0.35rem; }

    .post-content code {
      font-size: 0.88em;
      background: var(--chip-bg);
      border: 1px solid rgba(120, 84, 60, 0.2);
      border-radius: 4px;
      padding: 0.1em 0.4em;
      font-family: "Menlo", "Monaco", "Consolas", monospace;
    }

    .post-content pre {
      background: #2a1a0f;
      border-radius: 0.8rem;
      padding: 1.2rem 1.4rem;
      overflow-x: auto;
      margin: 0 0 1.2rem;
    }

    .post-content pre code {
      background: none;
      border: none;
      padding: 0;
      color: #e6d5c3;
      font-size: 0.87rem;
    }

    .post-content blockquote {
      border-left: 3px solid var(--accent);
      margin: 0 0 1.1rem;
      padding: 0.3rem 0 0.3rem 1.2rem;
      font-style: italic;
    }
  </style>
</head>

<body>
  <header class="top-nav">
    <div class="nav-inner">
      <a href="/" class="logo" aria-label="Home">
        <span class="logo-text">Mohammed Farah</span>
      </a>

      <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/#about">About</a>
        <a href="/#projects">Projects</a>
        <a href="/#skills">Skills</a>
        <a href="/#contact">Contact</a>
        <a href="/blog/" class="active">Blog</a>
        <a
          href="/assets/Mohammed_Farah_Resume.pdf"
          class="btn nav-resume"
          target="_blank"
          rel="noopener noreferrer"
        >
          Download Resume
        </a>
      </nav>
    </div>
  </header>

  <main class="post-wrap">
    <a href="/blog/" class="post-back">← Blog</a>
    <h1 class="post-title">{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">
      {{ page.date | date: "%-d %B %Y" }}
    </time>
    <hr class="post-divider" />
    <div class="post-content">
      {{ content }}
    </div>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> Mohammed Farah.</span>
    <span class="footer-dot">•</span>
    <span>Built on GitHub Pages.</span>
  </footer>
</body>
</html>
